# Netlify Configuration for ThreatCast Enterprise SOC Platform

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy API requests to the live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://threatcast-ai-network-attack-forecasting.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) Client-Side Route Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Enterprise Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
