# Netlify Configuration for ThreatCast Enterprise SOC Platform

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Optional: Proxy API requests to your live backend service if configured
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api-domain.com/api/:splat"
#   status = 200
#   force = true

# Single Page Application (SPA) Client-Side Route Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Enterprise Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
