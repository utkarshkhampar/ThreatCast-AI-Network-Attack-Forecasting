# Render Infrastructure as Code Specification for ThreatCast SOC Backend
services:
  - type: web
    name: threatcast-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && pip install greenlet
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./threatcast.db
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: SMTP_ENABLED
        value: "false"
